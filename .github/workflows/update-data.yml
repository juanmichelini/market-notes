name: Update Market Data

on:
  schedule:
    - cron: '0 2 * * 2-6'  # 02:00 UTC Tuesday–Saturday (after US market close Mon–Fri)
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter core run build

      - name: Fetch market data
        run: pnpm run fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # `main` requires pull requests (ruleset "require-pr"), so the job cannot push
      # to it directly. It pushes a dated branch, opens a pull request and
      # squash-merges it. This needs the repository setting "Allow GitHub Actions
      # to create and approve pull requests" (Settings > Actions > General).
      - name: Commit updated data files
        # Also when a fetch failed, so one bad series does not block the rest;
        # the job still ends red because the fetch step failed.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."; exit 0
          fi
          day="$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "data/update-$day"
          git commit -m "chore(data): update market data $day"
          git push --force origin "data/update-$day"
          gh pr create --base main --head "data/update-$day" \
            --title "chore(data): update market data $day" \
            --body "Nightly data refresh by the Update Market Data workflow."
          gh pr merge "data/update-$day" --squash --delete-branch
