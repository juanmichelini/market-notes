name: Build country outlines

# Manual only. Generates frontend/static/geo/countries.geojson from the
# world-atlas package (Natural Earth, public domain) and opens a pull request.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install world-atlas and topojson-client
        run: |
          mkdir -p "$RUNNER_TEMP/geo"
          cd "$RUNNER_TEMP/geo"
          npm init -y >/dev/null
          npm install --no-audit --no-fund world-atlas@2.0.2 topojson-client@3.1.0

      - name: Generate countries.geojson
        run: node .github/scripts/build-countries-geojson.mjs "$RUNNER_TEMP/geo" frontend/static/geo/countries.geojson

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- frontend/static/geo/countries.geojson && [ -z "$(git ls-files --others --exclude-standard frontend/static/geo)" ]; then
            echo "No change."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/country-outlines
          git add frontend/static/geo/countries.geojson
          git commit -m "chore(data): add country outlines for the price map (#105)"
          git push --force origin chore/country-outlines
          gh pr create --base main --head chore/country-outlines \
            --title "chore(data): country outlines for the price map (#105)" \
            --body "Generated by the Build country outlines workflow from world-atlas 2.0.2 (Natural Earth, public domain), 110m resolution."
