name: Feature Request
description: Propose a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Before submitting, read ARCHITECTURE.md and check that your request fits the current version scope."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be added or changed?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know this is done?
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      options: ["v0.1", "v1", "v2"]
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: ["core", "fetcher", "frontend", "data", "ci", "docs"]
    validations:
      required: true
