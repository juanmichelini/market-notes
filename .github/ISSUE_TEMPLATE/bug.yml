name: Bug Report
description: Report a bug or incorrect behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      options: ["v0.1", "v1", "v2"]
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: ["core", "fetcher", "frontend", "data", "ci", "docs"]
    validations:
      required: true
